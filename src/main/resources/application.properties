spring.application.name=ServiceHub

spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/servicehub
spring.datasource.username=servicehub
spring.datasource.password=servicehub

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

app.admin.email=${ADMIN_EMAIL:admin@servicehub.com}
app.admin.password=${ADMIN_PASSWORD:Admin123}

jwt.secret=${JWT_SECRET:servicehub-dev-secret-change-me-in-production-0123456789}
jwt.expiration=86400000